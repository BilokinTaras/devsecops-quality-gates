[project]
name = "devsecops-quality-gates"
version = "0.1.0"
description = "Layered security testing pipeline for OWASP crAPI: secrets, SAST, SCA, SBOM, DAST, API security regression tests and a quality gate."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "mypy==2.4.1",
    "ruff==0.17.3",
    "types-pyyaml==6.0.12.20261030",
    "pre-commit==4.7.0",
    "markdown-it-py==4.0.0",
]
security-tests = [
    "httpx==0.28.1",
    "pydantic==2.14.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PT", "C4", "PL"]
# E501: line length is enforced by `ruff format`; long string literals are allowed.
ignore = ["PLR0913", "PLR2004", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004"]
"security_tests/**" = ["S101", "S105", "S106", "S113", "PLR2004"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["tools", "tests", "security_tests"]
explicit_package_bases = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
testpaths = ["tests"]
markers = [
    "finding(id): links a security regression test to a FINDING-NNN record",
    "positive_control: crAPI behaves securely here; the test must pass",
]

[tool.coverage.run]
source = ["tools"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
